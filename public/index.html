<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCund Mentor</title>
<style>
  :root { --green:#0b6b3a; --bg:#f4f6f5; --card:#fff; --txt:#1c2421; --muted:#66736d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--txt); height:100vh; display:flex; flex-direction:column; }
  header { background:var(--green); color:#fff; padding:12px 18px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  button { cursor:pointer; border:0; border-radius:8px; padding:9px 14px; background:var(--green); color:#fff; font-size:14px; }
  header button { background:#fff; color:var(--green); }
  main { flex:1; display:flex; gap:14px; padding:14px; min-height:0; }
  #chat { flex:1; display:flex; flex-direction:column; background:var(--card); border-radius:12px; min-width:0; }
  #log { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:82%; padding:10px 13px; border-radius:12px; white-space:pre-wrap; line-height:1.45; }
  .user { align-self:flex-end; background:var(--green); color:#fff; }
  .bot { align-self:flex-start; background:#e9eeeb; }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid #e3e8e5; }
  input { flex:1; padding:11px; border:1px solid #cfd8d3; border-radius:8px; font-size:15px; }
  aside { width:290px; background:var(--card); border-radius:12px; padding:14px; overflow-y:auto; }
  aside h2 { font-size:15px; margin:0 0 10px; }
  .note { border:1px solid #dfe6e2; border-radius:8px; padding:8px; margin-bottom:8px; font-size:14px; }
  .note b { display:block; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 12px 10px; }
  .chips button { background:#e9eeeb; color:var(--txt); font-size:13px; padding:6px 10px; }
  @media (max-width:760px){ aside{display:none;} }
</style>
</head>
<body>
<header>
  <h1>UCund Mentor 🎓</h1>
  <button id="lang">EN</button>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <div class="chips" id="chips"></div>
    <form id="form"><input id="input" autocomplete="off"><button id="send"></button></form>
  </section>
  <aside><h2 id="notesTitle"></h2><div id="notes"></div></aside>
</main>
<script>
const T = {
  es: { hello:'¡Hola! Soy UCund Mentor. Te ayudo con Machine Learning, el modelo MEDIT y la Declaración de la Persona Transhumana, y puedo guardar tus notas de estudio.',
        ph:'Escribe tu pregunta…', send:'Enviar', notes:'📝 Mis notas', empty:'Aún no tienes notas.', think:'Pensando…', err:'Error: ',
        chips:['¿Qué es overfitting?','¿Qué es la persona transhumana en UCundinamarca?','Guarda una nota: repasar regresión lineal','Lista mis notas'] },
  en: { hello:"Hi! I'm UCund Mentor. I help with Machine Learning, the MEDIT model and the Transhuman Person Declaration, and I can save your study notes.",
        ph:'Type your question…', send:'Send', notes:'📝 My notes', empty:'You have no notes yet.', think:'Thinking…', err:'Error: ',
        chips:['What is overfitting?','What is the transhuman person at UCundinamarca?','Save a note: review linear regression','List my notes'] }
};
let lang = 'es', history = [];
const sessionId = localStorage.sid || (localStorage.sid = crypto.randomUUID());
const $ = id => document.getElementById(id);

function add(role, text, meta) {
  const d = document.createElement('div'); d.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; d.appendChild(m); }
  $('log').appendChild(d); $('log').scrollTop = 1e9; return d;
}
function render() {
  const t = T[lang];
  $('input').placeholder = t.ph; $('send').textContent = t.send; $('notesTitle').textContent = t.notes;
  $('lang').textContent = lang === 'es' ? 'EN' : 'ES'; document.documentElement.lang = lang;
  $('chips').innerHTML = '';
  t.chips.forEach(c => { const b = document.createElement('button'); b.type = 'button'; b.textContent = c; b.onclick = () => ask(c); $('chips').appendChild(b); });
}
async function loadNotes() {
  const r = await fetch('/api/notes?sessionId=' + sessionId); const { notes } = await r.json();
  const box = $('notes'); box.innerHTML = '';
  if (!notes.length) { box.textContent = T[lang].empty; return; }
  notes.forEach(n => { const d = document.createElement('div'); d.className = 'note';
    const b = document.createElement('b'); b.textContent = `#${n.id} ${n.title}`; d.appendChild(b); d.appendChild(document.createTextNode(n.content)); box.appendChild(d); });
}
async function ask(text) {
  if (!text.trim()) return;
  add('user', text); $('input').value = '';
  const wait = add('bot', T[lang].think);
  try {
    const r = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:text, history, sessionId, lang }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    wait.remove();
    const meta = [data.sources.length ? '📚 ' + data.sources.join(', ') : '', data.toolCalls.length ? '🛠 ' + data.toolCalls.map(c => c.name).join(', ') : ''].filter(Boolean).join('  ·  ');
    add('bot', data.reply, meta);
    history.push({ role:'user', text }, { role:'model', text:data.reply });
    loadNotes();
  } catch (e) { wait.textContent = T[lang].err + e.message; }
}
$('form').onsubmit = e => { e.preventDefault(); ask($('input').value); };
$('lang').onclick = () => { lang = lang === 'es' ? 'en' : 'es'; render(); };
render(); add('bot', T.es.hello); loadNotes();
</script>
</body>
</html>
